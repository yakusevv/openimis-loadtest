name: Load test

on:
  # Started by hand, or called from a workflow in another repository.
  workflow_dispatch:
    inputs:
      be_tag:
        description: Backend image tag (openimis-be); empty keeps the stack's .env.example value
        default: ""
      fe_tag:
        description: Frontend image tag (openimis-fe); empty keeps the stack's .env.example value
        default: ""
      db_tag:
        description: Database image tag (openimis-pgsql); empty keeps the stack's .env.example value
        default: ""
      dist_ref:
        description: Branch or tag of openimis-dist_dkr providing the stack; empty means its default branch
        default: ""
      preset:
        description: seed_synthetic_health_data preset
        type: choice
        options: [small, medium, large]
        default: medium
      users:
        description: Concurrent simulated users
        default: "20"
      spawn_rate:
        description: Users started per second
        default: "2"
      run_time:
        description: Load duration, e.g. 5m
        default: 5m
      fail_ratio:
        description: Fail above this share of failed requests
        default: "0.01"
      p95_ceiling_ms:
        description: Fail above this aggregate p95 in ms (0 = no ceiling)
        default: "4000"
  workflow_call:
    # The same inputs, for openimis-dist_dkr and any other repository that runs the load test;
    # the run then belongs to the caller. Defaults match the manual ones above.
    inputs:
      be_tag:
        type: string
        default: ""
      fe_tag:
        type: string
        default: ""
      db_tag:
        type: string
        default: ""
      dist_repository:
        description: Repository providing the stack
        type: string
        default: openimis/openimis-dist_dkr
      dist_ref:
        type: string
        default: ""
      preset:
        type: string
        default: medium
      users:
        type: string
        default: "20"
      spawn_rate:
        type: string
        default: "2"
      run_time:
        type: string
        default: 5m
      fail_ratio:
        type: string
        default: "0.01"
      p95_ceiling_ms:
        type: string
        default: "4000"
      loadtest_repository:
        description: Repository holding this workflow, whose files the job checks out explicitly
        type: string
        default: openimis/openimis-loadtest
      loadtest_ref:
        description: Ref of loadtest_repository; name the same ref as the caller's uses line
        type: string
        default: main

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds pipefail, which GitHub's default shell lacks: a failing command piped
    # into another must fail its step.
    shell: bash

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Named INPUT_*: Docker Compose prefers the shell environment over .env, so an empty BE_TAG
      # here would replace the tag in .env with nothing.
      INPUT_BE_TAG: ${{ inputs.be_tag }}
      INPUT_FE_TAG: ${{ inputs.fe_tag }}
      INPUT_DB_TAG: ${{ inputs.db_tag }}
      DIST_REPOSITORY: ${{ inputs.dist_repository || 'openimis/openimis-dist_dkr' }}
      DIST_REF: ${{ inputs.dist_ref }}
      PRESET: ${{ inputs.preset || 'medium' }}
      USERS: ${{ inputs.users || '20' }}
      SPAWN_RATE: ${{ inputs.spawn_rate || '2' }}
      RUN_TIME: ${{ inputs.run_time || '5m' }}
      LOADTEST_FAIL_RATIO: ${{ inputs.fail_ratio || '0.01' }}
      # About 3x the aggregate p95 this profile measured on a hosted runner (1.3 s), rounded up to a second.
      LOADTEST_P95_MS: ${{ inputs.p95_ceiling_ms || '4000' }}
      TARGET: http://localhost
    steps:
      - name: Check out the load test
        uses: actions/checkout@v4
        with:
          # Called from another repository, the default checkout would be that repository.
          repository: ${{ inputs.loadtest_repository || github.repository }}
          ref: ${{ inputs.loadtest_ref || github.sha }}

      - name: Check out the stack
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DIST_REPOSITORY }}
          ref: ${{ env.DIST_REF }}
          path: dist

      - name: Start the stack
        working-directory: dist
        run: |
          cp .env.example .env
          sed -i '/^DEMO_DATASET=/d;/^SECRET_KEY=/d;/^DOMAIN=/d;/^HOSTS=/d' .env
          {
            echo "SECRET_KEY=loadtest"
            echo "DEMO_DATASET=true"
            echo "DOMAIN=localhost"
            echo "HOSTS=localhost"
            # Celery is not under test; one worker leaves the memory to the stack that is.
            echo "WORKER_REPLICAS=1"
          } >> .env
          mkdir -p ../out
          printf 'stack\t%s %s\t%s\n' "$DIST_REPOSITORY" "${DIST_REF:-(default branch)} $(git rev-parse --short HEAD)" \
            "checkout" > ../out/stack.tsv
          for tag in BE_TAG FE_TAG DB_TAG; do
            input="INPUT_$tag"
            value=${!input}
            if [ -n "$value" ]; then
              sed -i "/^$tag=/d" .env
              echo "$tag=$value" >> .env
              source=input
            else
              value=$(sed -n "s/^$tag=//p" .env | tail -n 1)
              source=.env.example
            fi
            if [ -z "$value" ]; then
              echo "::error::$tag is neither an input nor set in the stack's .env.example"
              exit 1
            fi
            echo "$tag=$value" >> "$GITHUB_ENV"
            printf '%s\t%s\t%s\n' "$tag" "$value" "$source" >> ../out/stack.tsv
          done
          column -t -s "$(printf '\t')" ../out/stack.tsv
          cp .env.openSearch.example .env.openSearch
          docker compose up -d --quiet-pull
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' "$TARGET/api/graphql" || true)
            if [ "$code" = 200 ]; then echo "API ready after $((i * 10)) s"; exit 0; fi
            sleep 10
          done
          echo "::error::the API did not answer through nginx within 10 minutes"
          docker compose ps -a
          exit 1

      - name: Seed the dataset
        working-directory: dist
        run: |
          # --no-deps: without it compose runs the migrations service again first.
          if ! docker compose run --rm --no-deps -T backend manage help seed_synthetic_health_data > ../seed-help.log 2>&1; then
            tail -n 20 ../seed-help.log
            echo "::error::openimis-be:$BE_TAG cannot run seed_synthetic_health_data (output above); the command ships in the claim module from release 26.10"
            exit 1
          fi
          docker compose run --rm --no-deps -T backend manage seed_synthetic_health_data --preset "$PRESET" --no-confirm \
            | grep -v -E 'Progress:'
          mkdir -p ../out
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -F "	" -c "
            select t, n from (
              select 1, '\''families'\'', count(*) from \"tblFamilies\" where \"ValidityTo\" is null
              union all select 2, '\''insurees'\'', count(*) from \"tblInsuree\" where \"ValidityTo\" is null
              union all select 3, '\''policies'\'', count(*) from \"tblPolicy\" where \"ValidityTo\" is null
              union all select 4, '\''claims'\'', count(*) from \"tblClaim\" where \"ValidityTo\" is null
              union all select 5, '\''claim items'\'', count(*) from \"tblClaimItems\"
              union all select 6, '\''claim services'\'', count(*) from \"tblClaimServices\"
            ) x(o, t, n) order by o"' > ../out/dataset.tsv
          cat ../out/dataset.tsv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Locust
        run: pip install -r requirements.txt

      - name: Smoke, one user
        # Every scenario once, and any failed request fails this step: a broken endpoint is
        # reported here, not as a slow one.
        env:
          LOADTEST_SMOKE: "1"
          LOADTEST_FAIL_RATIO: "0"
          LOADTEST_P95_MS: "0"
        run: locust --headless --host "$TARGET" -u 1 -r 1 -t 2m

      - name: Load
        id: load
        run: >-
          locust --headless --host "$TARGET" -u "$USERS" -r "$SPAWN_RATE" -t "$RUN_TIME"
          --csv out/run --html out/report.html --json-file out/summary

      - name: Job summary
        if: always()
        run: python3 .github/scripts/summary.py out >> "$GITHUB_STEP_SUMMARY"

      - name: Stack logs
        if: failure()
        working-directory: dist
        run: |
          mkdir -p ../out
          docker compose ps -a > ../out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../out/compose.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
