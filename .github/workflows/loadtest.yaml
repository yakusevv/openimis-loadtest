name: Load test

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: >-
          openIMIS release to test: develop, a release such as 26.10, or release-branch for the newest
          release branch; several, comma-separated, run side by side as the nightly does
        default: develop
      be_tag:
        description: Override the backend image tag (openimis-be)
        default: ""
      fe_tag:
        description: Override the frontend image tag (openimis-fe)
        default: ""
      db_tag:
        description: Override the database image tag (openimis-pgsql)
        default: ""
      dist_ref:
        description: Override the openimis-dist_dkr branch or tag providing the stack
        default: ""
      preset:
        description: seed_synthetic_health_data preset
        type: choice
        options: [small, medium, large]
        default: medium
      users:
        description: Concurrent simulated users
        default: "20"
      spawn_rate:
        description: Users started per second
        default: "2"
      run_time:
        description: Load duration, e.g. 5m
        default: 5m
      fail_ratio:
        description: Fail above this share of failed requests
        default: "0.01"
      p95_ceiling_ms:
        description: Fail above this aggregate p95 in ms (0 = no ceiling)
        default: "4000"

  workflow_call:
    # The same inputs, for openimis-dist_dkr and any other repository that runs the load test;
    # the run then belongs to the caller. Defaults match the manual ones above.
    inputs:
      release:
        type: string
        default: develop
      be_tag:
        type: string
        default: ""
      fe_tag:
        type: string
        default: ""
      db_tag:
        type: string
        default: ""
      dist_repository:
        description: Repository providing the stack
        type: string
        default: openimis/openimis-dist_dkr
      dist_ref:
        type: string
        default: ""
      preset:
        type: string
        default: medium
      users:
        type: string
        default: "20"
      spawn_rate:
        type: string
        default: "2"
      run_time:
        type: string
        default: 5m
      fail_ratio:
        type: string
        default: "0.01"
      p95_ceiling_ms:
        type: string
        default: "4000"
      loadtest_repository:
        description: Repository holding this workflow; a caller's own checkout would be the caller
        type: string
        default: openimis/openimis-loadtest
      loadtest_ref:
        description: Ref of loadtest_repository; name the same ref as the caller's uses line
        type: string
        default: main

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds pipefail, which GitHub's default shell lacks: a failing command piped
    # into another must fail its step.
    shell: bash

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - id: plan
        env:
          # The nightly tests the line in development and the line about to ship.
          WANTED: ${{ github.event_name == 'schedule' && 'develop,release-branch' || inputs.release || 'develop' }}
        run: >-
          python3 -c 'import json, os; print("releases=" + json.dumps([r.strip() for r in os.environ["WANTED"].split(",") if r.strip()]))'
          >> "$GITHUB_OUTPUT"

  load-test:
    name: load-test (${{ matrix.release }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      WANTED_RELEASE: ${{ matrix.release }}
      # A scheduled run has no inputs; each falls back to the dispatch default.
      OVERRIDE_BE_TAG: ${{ inputs.be_tag }}
      OVERRIDE_FE_TAG: ${{ inputs.fe_tag }}
      OVERRIDE_DB_TAG: ${{ inputs.db_tag }}
      OVERRIDE_DIST_REF: ${{ inputs.dist_ref }}
      DIST_REPOSITORY: ${{ inputs.dist_repository || 'openimis/openimis-dist_dkr' }}
      PRESET: ${{ inputs.preset || 'medium' }}
      USERS: ${{ inputs.users || '20' }}
      SPAWN_RATE: ${{ inputs.spawn_rate || '2' }}
      RUN_TIME: ${{ inputs.run_time || '5m' }}
      LOADTEST_FAIL_RATIO: ${{ inputs.fail_ratio || '0.01' }}
      # 3x the p95 of the first green nightly-profile run on a hosted runner (1.3 s), rounded up to a second.
      LOADTEST_P95_MS: ${{ inputs.p95_ceiling_ms || '4000' }}
      TARGET: http://localhost
    steps:
      - name: Check out the load test
        uses: actions/checkout@v4
        with:
          # Called from another repository, the default checkout would be that repository.
          repository: ${{ inputs.loadtest_repository || github.repository }}
          ref: ${{ inputs.loadtest_ref || github.sha }}

      - name: Resolve the release
        # Each component follows the release where upstream publishes it and falls back to
        # develop where it does not; the job summary shows which is which.
        run: |
          mkdir -p out
          : > out/resolution.tsv
          pick() {  # name, override, wanted, exists-check command, fallback
            local name=$1 override=$2 wanted=$3 check=$4 fallback=$5 value how
            if [ -n "$override" ]; then value=$override how="override"
            elif [ "$wanted" = develop ] || $check "$wanted"; then value=$wanted how="release"
            else value=$fallback how="fallback: $wanted not published"
            fi
            printf '%s\t%s\t%s\n' "$name" "$value" "$how" >> out/resolution.tsv
            echo "$value"
          }
          image() { docker manifest inspect "ghcr.io/openimis/$IMAGE:$1" > /dev/null 2>&1; }
          branch() { git ls-remote --exit-code --heads "https://github.com/$DIST_REPOSITORY.git" "$1" > /dev/null; }
          RELEASE=$WANTED_RELEASE
          if [ "$RELEASE" = release-branch ]; then
            RELEASE=""
            for b in $(git ls-remote --heads https://github.com/openimis/openimis-be_py.git 'release/*' \
                | grep -o -E 'release/[0-9]{2}\.[0-9]{2}$' | cut -d/ -f2 | sort -r -V); do
              if IMAGE=openimis-be image "$b" && IMAGE=openimis-fe image "$b"; then RELEASE=$b; break; fi
            done
            if [ -z "$RELEASE" ]; then
              echo "::error::no release branch of openimis-be_py has published backend and frontend images"
              exit 1
            fi
            printf 'release\t%s\t%s\n' "$RELEASE" "newest release branch with published images" >> out/resolution.tsv
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          dist=$( [ "$RELEASE" = develop ] && echo develop || echo "release/$RELEASE" )
          {
            echo "BE_TAG=$(IMAGE=openimis-be pick 'backend image' "$OVERRIDE_BE_TAG" "$RELEASE" image '')"
            echo "FE_TAG=$(IMAGE=openimis-fe pick 'frontend image' "$OVERRIDE_FE_TAG" "$RELEASE" image '')"
            echo "DB_TAG=$(IMAGE=openimis-pgsql pick 'database image' "$OVERRIDE_DB_TAG" "$RELEASE" image develop)"
            echo "DIST_REF=$(pick 'openimis-dist_dkr ref' "$OVERRIDE_DIST_REF" "$dist" branch develop)"
          } >> "$GITHUB_ENV"
          if [ "$DIST_REPOSITORY" != openimis/openimis-dist_dkr ]; then
            printf 'stack repository\t%s\t%s\n' "$DIST_REPOSITORY" "override" >> out/resolution.tsv
          fi
          column -t -s "$(printf '\t')" out/resolution.tsv
          if grep -q -P "^(backend|frontend) image\t\t" out/resolution.tsv; then
            echo "::error::release $RELEASE has no published backend or frontend image"
            exit 1
          fi

      - name: Check out the stack
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DIST_REPOSITORY }}
          ref: ${{ env.DIST_REF }}
          path: dist

      - name: Start the stack
        working-directory: dist
        run: |
          cp .env.example .env
          sed -i '/^DEMO_DATASET=/d;/^BE_TAG=/d;/^FE_TAG=/d;/^DB_TAG=/d;/^SECRET_KEY=/d;/^DOMAIN=/d;/^HOSTS=/d' .env
          {
            echo "SECRET_KEY=loadtest"
            echo "DEMO_DATASET=true"
            echo "BE_TAG=$BE_TAG"
            echo "FE_TAG=$FE_TAG"
            echo "DB_TAG=$DB_TAG"
            echo "DOMAIN=localhost"
            echo "HOSTS=localhost"
            # Celery is not under test; one worker leaves the memory to the stack that is.
            echo "WORKER_REPLICAS=1"
          } >> .env
          cp .env.openSearch.example .env.openSearch
          docker compose up -d --quiet-pull
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' "$TARGET/api/graphql" || true)
            if [ "$code" = 200 ]; then echo "API ready after $((i * 10)) s"; exit 0; fi
            sleep 10
          done
          echo "::error::the API did not answer through nginx within 10 minutes"
          docker compose ps -a
          exit 1

      - name: Seed the dataset
        working-directory: dist
        run: |
          # --no-deps: without it compose runs the migrations service again first.
          if ! docker compose run --rm --no-deps -T backend manage help seed_synthetic_health_data > ../seed-help.log 2>&1; then
            tail -n 20 ../seed-help.log
            echo "::error::openimis-be:$BE_TAG cannot run seed_synthetic_health_data (output above); the command ships in the claim module from release 26.10"
            exit 1
          fi
          docker compose run --rm --no-deps -T backend manage seed_synthetic_health_data --preset "$PRESET" --no-confirm \
            | grep -v -E 'Progress:'
          mkdir -p ../out
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -F "	" -c "
            select t, n from (
              select 1, '\''families'\'', count(*) from \"tblFamilies\" where \"ValidityTo\" is null
              union all select 2, '\''insurees'\'', count(*) from \"tblInsuree\" where \"ValidityTo\" is null
              union all select 3, '\''policies'\'', count(*) from \"tblPolicy\" where \"ValidityTo\" is null
              union all select 4, '\''claims'\'', count(*) from \"tblClaim\" where \"ValidityTo\" is null
              union all select 5, '\''claim items'\'', count(*) from \"tblClaimItems\"
              union all select 6, '\''claim services'\'', count(*) from \"tblClaimServices\"
            ) x(o, t, n) order by o"' > ../out/dataset.tsv
          cat ../out/dataset.tsv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Locust
        run: pip install -r requirements.txt

      - name: Smoke, one user
        # Every scenario once, and any failed request fails this step: a broken endpoint is
        # reported here, not as a slow one.
        env:
          LOADTEST_SMOKE: "1"
          LOADTEST_FAIL_RATIO: "0"
          LOADTEST_P95_MS: "0"
        run: locust --headless --host "$TARGET" -u 1 -r 1 -t 2m

      - name: Load
        id: load
        run: >-
          locust --headless --host "$TARGET" -u "$USERS" -r "$SPAWN_RATE" -t "$RUN_TIME"
          --csv out/run --html out/report.html --json-file out/summary

      - name: Job summary
        if: always()
        run: python3 .github/scripts/summary.py out >> "$GITHUB_STEP_SUMMARY"

      - name: Stack logs
        if: failure()
        working-directory: dist
        run: |
          mkdir -p ../out
          docker compose ps -a > ../out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../out/compose.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ matrix.release }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
